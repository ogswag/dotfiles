# Show tab numbers so Cmd+N matches what you see
tab_title_template "{index}: {title}"

# ---------------------------------------------------------------------------
# Russian duplicates of default letter shortcuts
# ---------------------------------------------------------------------------
# Clipboard
map --allow-fallback=shifted,ascii kitty_mod+с  copy_to_clipboard
map --allow-fallback=shifted,ascii kitty_mod+м  paste_from_clipboard
map --allow-fallback=shifted,ascii kitty_mod+ы  paste_from_selection
map --allow-fallback=shifted,ascii kitty_mod+щ  pass_selection_to_program
map --allow-fallback=shifted,ascii cmd+с        copy_or_noop
map --allow-fallback=shifted,ascii cmd+м        paste_from_clipboard

# Tabs / OS windows
# map --allow-fallback=shifted,ascii kitty_mod+е      new_tab
# map --allow-fallback=shifted,ascii kitty_mod+й      close_tab
map --allow-fallback=shifted,ascii kitty_mod+alt+е  set_tab_title
map --allow-fallback=shifted,ascii kitty_mod+т      new_os_window
map --allow-fallback=shifted,ascii cmd+е            new_tab
# map --allow-fallback=shifted,ascii cmd+ц            close_tab
map --allow-fallback=shifted,ascii cmd+т            new_os_window
map --allow-fallback=shifted,ascii shift+cmd+ш      set_tab_title

# Windows inside a tab
map --allow-fallback=shifted,ascii kitty_mod+ц  close_window
map --allow-fallback=shifted,ascii kitty_mod+к  start_resizing_window
map --allow-fallback=shifted,ascii kitty_mod+а  move_window_forward
map --allow-fallback=shifted,ascii kitty_mod+и  move_window_backward
map --allow-fallback=shifted,ascii kitty_mod+д  next_layout
map --allow-fallback=shifted,ascii cmd+к        start_resizing_window
map --allow-fallback=shifted,ascii shift+cmd+в  close_window

# Scrollback / prompts / URLs
map --allow-fallback=shifted,ascii kitty_mod+я  scroll_to_prompt -1
map --allow-fallback=shifted,ascii kitty_mod+ч  scroll_to_prompt 1
map --allow-fallback=shifted,ascii kitty_mod+р  show_scrollback
map --allow-fallback=shifted,ascii kitty_mod+п  show_last_command_output
map --allow-fallback=shifted,ascii kitty_mod+у  open_url
map --allow-fallback=shifted,ascii kitty_mod+г  kitten unicode_input

# Opacity combo (kitty_mod+a then key) — first key only
map --allow-fallback=shifted,ascii kitty_mod+ф>m  set_background_opacity +0.1
map --allow-fallback=shifted,ascii kitty_mod+ф>l  set_background_opacity -0.1
map --allow-fallback=shifted,ascii kitty_mod+ф>1  set_background_opacity 1
map --allow-fallback=shifted,ascii kitty_mod+ф>d  set_background_opacity default
map --allow-fallback=shifted,ascii kitty_mod+ф>ь  set_background_opacity +0.1
map --allow-fallback=shifted,ascii kitty_mod+ф>д  set_background_opacity -0.1
map --allow-fallback=shifted,ascii kitty_mod+ф>в  set_background_opacity default

# macOS chrome that uses letters
map --allow-fallback=shifted,ascii cmd+л        clear_terminal to_cursor active
map --allow-fallback=shifted,ascii cmd+д        clear_terminal last_command active
map --allow-fallback=shifted,ascii cmd+ь        minimize_macos_window
map --allow-fallback=shifted,ascii cmd+р        hide_macos_app
map --allow-fallback=shifted,ascii cmd+й        quit


# ---------------------------------------------------------------------------
# Tabs like macOS
# ---------------------------------------------------------------------------

map cmd+1   goto_tab 1
map cmd+2   goto_tab 2
map cmd+3   goto_tab 3
map cmd+4   goto_tab 4
map cmd+5   goto_tab 5
map cmd+6   goto_tab 6
map cmd+7   goto_tab 7
map cmd+8   goto_tab 8
map cmd+9   goto_tab 9
map cmd+0   change_font_size all 0

# Linux:
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9
map super+0 change_font_size all 0

map ctrl+tab        next_tab
map ctrl+shift+tab  previous_tab
map shift+cmd+]     next_tab
map shift+cmd+[     previous_tab

map --allow-fallback=shifted,ascii cmd+t  new_tab_with_cwd
map --allow-fallback=shifted,ascii cmd+е  new_tab_with_cwd
map --allow-fallback=shifted,ascii cmd+w  close_window_with_confirmation ignore-shell
map --allow-fallback=shifted,ascii cmd+ц  close_window_with_confirmation ignore-shell
map --allow-fallback=shifted,ascii cmd+shift+w  close_tab
map --allow-fallback=shifted,ascii cmd+shift+ц  close_tab

# kitty_mod+1..9 stay as tiled-window focus (Kitty default)
# Uncomment to steal those for tabs as well:
# map kitty_mod+1 goto_tab 1
# map kitty_mod+2 goto_tab 2
# map kitty_mod+3 goto_tab 3
# map kitty_mod+4 goto_tab 4
# map kitty_mod+5 goto_tab 5
# map kitty_mod+6 goto_tab 6
# map kitty_mod+7 goto_tab 7
# map kitty_mod+8 goto_tab 8
# map kitty_mod+9 goto_tab 9
# map kitty_mod+0 goto_tab -1

# ---------------------------------------------------------------------------
# Layout management
# ---------------------------------------------------------------------------
# enabled_layouts all
enabled_layouts splits, stack, tall, fat, grid

map --allow-fallback=shifted,ascii cmd+d        launch --location=vsplit --cwd=current
map --allow-fallback=shifted,ascii cmd+в        launch --location=vsplit --cwd=current
map --allow-fallback=shifted,ascii cmd+shift+d  launch --location=hsplit --cwd=current
map --allow-fallback=shifted,ascii cmd+shift+в  launch --location=hsplit --cwd=current

map cmd+alt+left   neighboring_window left
map cmd+alt+right  neighboring_window right
map cmd+alt+up     neighboring_window up
map cmd+alt+down   neighboring_window down

map cmd+[  previous_window
map cmd+]  next_window

map cmd+shift+enter  toggle_layout stack

map ctrl+cmd+left   resize_window narrower
map ctrl+cmd+right  resize_window wider
map ctrl+cmd+up     resize_window taller
map ctrl+cmd+down   resize_window shorter
