# Show tab numbers so Cmd+N matches what you see
tab_title_template {index}: {title}

# ===========================================================================
# IMPORTANT:
# Do NOT duplicate bindings with Russian letters.
#
# --allow-fallback=shifted,ascii makes:
#
#   cmd+t      also work as cmd+е
#   cmd+w      also work as cmd+ц
#   cmd+d      also work as cmd+в
#   cmd+c      also work as cmd+с
#   etc.
# ===========================================================================


# ---------------------------------------------------------------------------
# Clipboard
# ---------------------------------------------------------------------------

map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard
map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard
map --allow-fallback=shifted,ascii kitty_mod+s paste_from_selection
map --allow-fallback=shifted,ascii kitty_mod+o pass_selection_to_program

map --allow-fallback=shifted,ascii cmd+c copy_or_noop
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard


# ---------------------------------------------------------------------------
# Tabs / OS windows
# ---------------------------------------------------------------------------

map --allow-fallback=shifted,ascii kitty_mod+alt+t set_tab_title
map --allow-fallback=shifted,ascii kitty_mod+n     new_os_window

map --allow-fallback=shifted,ascii cmd+n new_os_window
map --allow-fallback=shifted,ascii shift+cmd+i set_tab_title


# ---------------------------------------------------------------------------
# Windows inside a tab
# ---------------------------------------------------------------------------

map --allow-fallback=shifted,ascii kitty_mod+w close_window
map --allow-fallback=shifted,ascii kitty_mod+r start_resizing_window
map --allow-fallback=shifted,ascii kitty_mod+f move_window_forward
map --allow-fallback=shifted,ascii kitty_mod+b move_window_backward
map --allow-fallback=shifted,ascii kitty_mod+l next_layout

map --allow-fallback=shifted,ascii cmd+r start_resizing_window


# ---------------------------------------------------------------------------
# Scrollback / prompts / URLs
# ---------------------------------------------------------------------------

map --allow-fallback=shifted,ascii kitty_mod+z scroll_to_prompt -1
map --allow-fallback=shifted,ascii kitty_mod+x scroll_to_prompt 1
map --allow-fallback=shifted,ascii kitty_mod+h show_scrollback
map --allow-fallback=shifted,ascii kitty_mod+g show_last_command_output
map --allow-fallback=shifted,ascii kitty_mod+e open_url
map --allow-fallback=shifted,ascii kitty_mod+u kitten unicode_input


# ---------------------------------------------------------------------------
# Opacity combo
#
# Russian layout works automatically:
#
#   kitty_mod+a > m
#   becomes physically
#   kitty_mod+ф > ь
#
# ---------------------------------------------------------------------------

map --allow-fallback=shifted,ascii kitty_mod+a>m set_background_opacity +0.1
map --allow-fallback=shifted,ascii kitty_mod+a>l set_background_opacity -0.1
map --allow-fallback=shifted,ascii kitty_mod+a>1 set_background_opacity 1
map --allow-fallback=shifted,ascii kitty_mod+a>d set_background_opacity default


# ---------------------------------------------------------------------------
# macOS chrome
# ---------------------------------------------------------------------------

map --allow-fallback=shifted,ascii cmd+k clear_terminal to_cursor active
map --allow-fallback=shifted,ascii cmd+l clear_terminal last_command active

map --allow-fallback=shifted,ascii cmd+m minimize_macos_window
map --allow-fallback=shifted,ascii cmd+h hide_macos_app
map --allow-fallback=shifted,ascii cmd+q quit


# ===========================================================================
# Tabs like macOS
# ===========================================================================

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 change_font_size all 0

# Linux
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9
map super+0 change_font_size all 0


# Tab cycling
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab

# [] become хъ on Russian layout, so these need ascii fallback too.
map --allow-fallback=shifted,ascii shift+cmd+] next_tab
map --allow-fallback=shifted,ascii shift+cmd+[ previous_tab


# New tab, using the shell's last reported cwd (not a running child's)
map --allow-fallback=shifted,ascii cmd+t launch --type=tab --cwd=last_reported

# Cmd+W = close pane; confirm only if a non-shell is running (incl. bg jobs)
map --allow-fallback=shifted,ascii cmd+w kitten close_confirm.py window

# Cmd+Shift+W = close entire tab (same confirmation rules)
map --allow-fallback=shifted,ascii cmd+shift+w kitten close_confirm.py tab


# ===========================================================================
# Layout management
# ===========================================================================

enabled_layouts splits,stack,tall,fat,grid


# ---------------------------------------------------------------------------
# Splits
# ---------------------------------------------------------------------------

# Cmd+D
# Russian physical equivalent: Cmd+В
map --allow-fallback=shifted,ascii cmd+d launch --location=vsplit --cwd=last_reported

# Cmd+Shift+D
# Russian physical equivalent: Cmd+Shift+В
# Unmap kitty's macOS default (close_window) first.
map cmd+shift+d
map --allow-fallback=shifted,ascii cmd+shift+d launch --location=hsplit --cwd=last_reported


# ---------------------------------------------------------------------------
# Focus windows
# ---------------------------------------------------------------------------

map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down

# [ and ] are х and ъ in Russian, therefore use ASCII fallback.
map --allow-fallback=shifted,ascii cmd+[ previous_window
map --allow-fallback=shifted,ascii cmd+] next_window


# ---------------------------------------------------------------------------
# Stack / zoom
# ---------------------------------------------------------------------------

map cmd+shift+enter toggle_layout stack


# ---------------------------------------------------------------------------
# Resize
# ---------------------------------------------------------------------------

map ctrl+cmd+left  resize_window narrower
map ctrl+cmd+right resize_window wider
map ctrl+cmd+up    resize_window taller
map ctrl+cmd+down  resize_window shorter
