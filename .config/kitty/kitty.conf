font_size        12.0

editor nvim

disable_ligatures never

hide_window_decorations titlebar-only
macos_titlebar_color background
macos_show_window_title_in window

remember_window_size  no
initial_window_width  120c
initial_window_height 40c

tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 1
tab_title_max_length 20
tab_powerline_style angled
active_tab_font_style bold
inactive_tab_font_style normal

# cursor_trail 1
# cursor_trail_decay 0.1 0.2

# infinite scrollback
scrollback_lines -1

shell_integration enabled
# -1 plus shell integration means: count only windows that are not sitting at a prompt
confirm_os_window_close -1 count-background

include kitty-ru-tabs.conf

map cmd+plus        change_font_size current +1.0
map cmd+equal       change_font_size current +1.0
map shift+cmd+equal change_font_size current +1.0
map cmd+minus       change_font_size current -1.0
map shift+cmd+minus change_font_size current -1.0
map cmd+0           change_font_size current 0
map ctrl+shift+equal    change_font_size current +1.0
map ctrl+shift+plus     change_font_size current +1.0
map ctrl+shift+kp_add   change_font_size current +1.0
map ctrl+shift+minus    change_font_size current -1.0
map ctrl+shift+kp_subtract change_font_size current -1.0
map ctrl+shift+backspace change_font_size current 0

# BEGIN_KITTY_FONTS
font_family      family="Terminal Font 1"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
