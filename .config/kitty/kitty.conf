font_size        12.0

editor nvim

# font_family      family='IosevkaPlex Nerd Font Mono' postscript_name=IosevkaPlexNFM
# bold_font        family='IosevkaPlex Nerd Font Mono' postscript_name=IosevkaPlexNFM-Bold
# italic_font      auto
# bold_italic_font family='IosevkaPlex Nerd Font Mono' style='Bold Italic'

# Monaspace Xenon NF - texture healing + ligatures
# font_family      family='Monaspace Xenon NF' style=Regular
# bold_font        family='Monaspace Xenon NF' style=Bold
# italic_font      family='Monaspace Xenon NF' style=Italic
# bold_italic_font family='Monaspace Xenon NF' style='Bold Italic'

font_family      family="Monaspace Argon NF"
bold_font        family='Monaspace Argon NF' style=Bold
italic_font      family='Monaspace Argon NF' style=Italic
bold_italic_font family='Monaspace Argon NF' style='Bold Italic'

disable_ligatures never

# hide_window_decorations yes
macos_titlebar_color background
macos_show_window_title_in window

remember_window_size  no
initial_window_width  120c
initial_window_height 40c

tab_bar_edge bottom
tab_bar_style fade
tab_bar_min_tabs 1
tab_title_max_length 20
# tab_powerline_style angled
active_tab_font_style bold
inactive_tab_font_style normal

# cursor_trail 1
# cursor_trail_decay 0.1 0.2

# infinite scrollback
scrollback_lines -1

shell_integration enabled
# -1 plus shell integration means: count only windows that are not sitting at a prompt
confirm_os_window_close -1 count-background

include kitty-ru-tabs.conf
