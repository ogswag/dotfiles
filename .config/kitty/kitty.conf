font_size        12.0

# Monaspace Xenon NF - texture healing + ligatures
font_family      family='Monaspace Xenon NF' style=Regular features='+liga +ss01 +ss02 +ss04 +ss05 +ss06 +ss03 +ss07 +ss08 +ss09 +ss10 -calt'
bold_font        family='Monaspace Xenon NF' style=Bold features='+liga +ss01 +ss02 +ss04 +ss05 +ss06 +ss03 +ss07 +ss08 +ss09 +ss10 -calt'
italic_font      family='Monaspace Xenon NF' style=Italic features='+liga +ss01 +ss02 +ss04 +ss05 +ss06 +ss03 +ss07 +ss08 +ss09 +ss10 -calt'
bold_italic_font family='Monaspace Xenon NF' style='Bold Italic' features='+liga +ss01 +ss02 +ss04 +ss05 +ss06 +ss03 +ss07 +ss08 +ss09 +ss10 -calt'
disable_ligatures never


# hide_window_decorations yes
macos_titlebar_color background

remember_window_size  no
initial_window_width  120c
initial_window_height 40c

tab_bar_edge bottom
tab_bar_style fade
tab_bar_min_tabs 1
tab_title_max_length 20
# tab_powerline_style angled
active_tab_font_style bold
inactive_tab_font_style normal

# cursor_trail 1
# cursor_trail_decay 0.1 0.2

# infinite scrollback
scrollback_lines -1

shell_integration enabled
# -1 plus shell integration means: count only windows that are not sitting at a prompt
confirm_os_window_close -1 count-background

include kitty-ru-tabs.conf
